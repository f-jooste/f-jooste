<!-- https://github.com/DenverCoder1/readme-typing-svg/ -->
<svg xmlns='http://www.w3.org/2000/svg'
    xmlns:xlink='http://www.w3.org/1999/xlink'
    viewBox='0 0 260 60'
    style='background-color: #00000000;'
    width='260px' height='60px'>

    
                <path id='path0'>
                            <!-- Single line -->
                                <animate id='d0' attributeName='d' begin='0s;d0.end'
                    dur='12600ms' fill='remove'
                    values='m0,30 h0 ; m0,30 h260 ; m0,30 h260 ; m0,30 h0' keyTimes='0;0.22857142857143;0.94285714285714;1' />
                    </path>
    <text font-family='"JetBrains mono", monospace' fill='#2DD4BF' font-size='25'
        dominant-baseline='middle'
        x='0%' text-anchor='start'
        letter-spacing='normal'>
        <textPath xlink:href='#path0'>
            About me
        </textPath>
    </text>
</svg>
